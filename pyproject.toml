[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-telecom"
version = "1.1.1"
description = "Python SDK for the AI Telecom voice API — place AI phone calls with a phone number and a prompt."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MTDS", email = "contact@mtds.vn" }]
keywords = ["voice-ai", "telephony", "sdk", "mtds", "ai-telecom", "text-to-speech"]
dependencies = [
    "httpx>=0.24,<1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://telecom.mtds.vn/"
Documentation = "https://telecom.mtds.vn/api-docs.html"

# Ship only the package — keep tests out of the wheel.
[tool.hatch.build.targets.wheel]
packages = ["ai_telecom"]

[tool.pytest.ini_options]
testpaths = ["tests"]

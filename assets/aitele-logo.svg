<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-labelledby="title description">
  <title id="title">AITele</title>
  <desc id="description">AITele AI Voice Agent platform logo</desc>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="0.52" stop-color="#7C3AED" />
      <stop offset="1" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="brandText" x1="242" y1="0" x2="425" y2="0">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#312E81" flood-opacity="0.22" />
    </filter>
    <style>
      .wordmark { fill: #0F172A; }
      .tagline { fill: #475569; }
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #F8FAFC; }
        .tagline { fill: #CBD5E1; }
      }
    </style>
  </defs>

  <g transform="translate(28 22)" filter="url(#shadow)">
    <rect width="176" height="176" rx="48" fill="url(#brand)" />

    <path
      d="M55 50c8-8 20-8 28 0l10 10c5 5 6 13 2 19l-9 13c8 15 19 26 34 34l13-9c6-4 14-3 19 2l10 10c8 8 8 20 0 28l-5 5c-8 8-20 11-31 7-42-14-75-47-89-89-4-11-1-23 7-31z"
      fill="#FFFFFF"
    />

    <g fill="#FFFFFF" opacity="0.92">
      <rect x="117" y="42" width="8" height="28" rx="4" />
      <rect x="133" y="32" width="8" height="48" rx="4" />
      <rect x="149" y="47" width="8" height="18" rx="4" />
    </g>

    <circle cx="43" cy="137" r="6" fill="#67E8F9" />
    <circle cx="59" cy="153" r="4" fill="#C4B5FD" />
  </g>

  <text x="238" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="-4">
    <tspan fill="url(#brandText)">AI</tspan><tspan class="wordmark">Tele</tspan>
  </text>

  <g transform="translate(245 139)">
    <rect width="40" height="4" rx="2" fill="url(#brand)" />
    <text x="55" y="12" class="tagline" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="5">
      AI VOICE AGENT
    </text>
  </g>
